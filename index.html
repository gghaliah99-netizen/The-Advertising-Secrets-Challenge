<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Advertising Secrets Challenge</title><style>:root{font-family:Arial,sans-serif;color:#24134b;background:#f5efff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#f9d8ef,transparent 38%),linear-gradient(130deg,#ede5ff,#fff9ee);min-height:100vh}.wrap{max-width:950px;margin:auto;padding:24px}.top{background:#351566;color:white;padding:24px;border-radius:24px;box-shadow:0 12px 28px #381d6a30}h1{font-size:clamp(26px,5vw,43px);margin:0 0 10px}.sub{color:#f7dc8d}.progress{height:13px;background:#ddd1f6;border-radius:30px;margin:22px 0;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#b34bda,#e3aa39);transition:width .3s}.panel{background:white;border:2px solid #eadcf8;border-radius:26px;padding:clamp(18px,4vw,34px);box-shadow:0 12px 35px #4321751b}.counter{font-weight:bold;color:#7b3bb7}.ad{border-radius:20px;padding:25px;background:linear-gradient(115deg,#39206e,#6e35a5);color:white;margin:16px 0}.ad h2{font-size:clamp(26px,5vw,40px);margin:8px 0}.tag{display:inline-block;background:#ffd873;color:#4c2c62;border-radius:20px;padding:7px 12px;font-weight:bold}.claim{font-size:clamp(20px,3vw,28px);font-weight:bold;margin:16px 0}.detail{color:#f5e8ff}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.option{border:2px solid #d9c6ee;border-radius:16px;background:#faf7ff;color:#31165b;padding:17px;text-align:left;font-size:18px;font-weight:bold;cursor:pointer}.option:hover:not(:disabled){border-color:#a05bd3;background:#f2e5ff}.option:disabled{cursor:default}.correct{background:#e4f8ed!important;border-color:#168b58!important}.wrong{background:#ffe7e9!important;border-color:#d14c65!important}.feedback{padding:17px;border-radius:15px;background:#fff5d9;margin-top:18px;line-height:1.5;font-size:18px}.next{background:#351566;color:white;border:0;padding:15px 28px;border-radius:14px;font-size:18px;font-weight:bold;margin-top:17px;cursor:pointer}.next:hover{background:#6029a2}.score{font-size:22px;font-weight:bold}.foot{text-align:center;color:#6c6081;margin-top:22px}@media(max-width:620px){.options{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="top"><h1>🔎 The Advertising Secrets Challenge</h1><div class="sub">Look at the ad. Discover the persuasion technique.</div><div class="progress"><div class="bar" id="bar"></div></div><div id="status"></div></header><section class="panel" id="game" style="margin-top:20px" aria-live="polite"></section><div class="foot">Unit 5 · Do You Really Need It? · Lesson 1</div></main><script>const ads=[{name:'BMX-3000 Sports Car',emoji:'🏎️',claim:'“Set yourself apart from the crowd.”',detail:'The ad promises admiration, sophistication, and attention.',answer:'Be Special',why:'The ad appeals to the desire to stand out and be admired.'},{name:'Floral Essence Shampoo',emoji:'🌸',claim:'“28 vitamins and minerals”',detail:'The ad says studies show its exclusive formula makes hair twice as strong.',answer:'Statistics',why:'The ad uses numbers and a claim about studies to sound convincing.'},{name:'Dynex Laundry Detergent',emoji:'🧺',claim:'“33 percent more cleaning power”',detail:'The ad compares Dynex with the next leading brand.',answer:'Statistics',why:'The ad uses a percentage to support a product comparison.'},{name:'Crystal Spring Water',emoji:'💧',claim:'“100 percent all-natural spring water”',detail:'The ad describes a Swiss mountain spring and recyclable bottles.',answer:'Natural Appeal',why:'The ad emphasizes purity, nature, and environmental care.'},{name:'Planet Mercury Sneakers',emoji:'👟',claim:'“Take it from NBA star Derek Larkin.”',detail:'The ad also says, “Join the Planet Mercury generation.”',answer:'Celebrity Endorsement',why:'A famous athlete is used to promote the shoes. The ad also suggests belonging to a group.'}];const choices=['Be Special','Follow the Crowd','Statistics','Celebrity Endorsement','Natural Appeal'];let i=0,score=0,selected=null;const game=document.getElementById('game');function render(){document.getElementById('bar').style.width=(i/ads.length*100)+'%';document.getElementById('status').textContent='Ad '+(i+1)+' of '+ads.length+' · Score: '+score;let a=ads[i];game.innerHTML='<div class="counter">ADVERTISEMENT '+(i+1)+'</div><div class="ad"><span class="tag">'+a.emoji+' FEATURED PRODUCT</span><h2>'+a.name+'</h2><div class="claim">'+a.claim+'</div><div class="detail">'+a.detail+'</div></div><h2>What is the main persuasion technique?</h2><div class="options">'+choices.map((c,j)=>'<button class="option" data-choice="'+j+'">'+c+'</button>').join('')+'</div><div id="response"></div>';game.querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>answer(choices[+b.dataset.choice])))}function answer(c){if(selected!==null)return;selected=c;const a=ads[i],ok=c===a.answer;if(ok)score++;game.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(b.textContent===a.answer)b.classList.add('correct');else if(b.textContent===c)b.classList.add('wrong')});document.getElementById('response').innerHTML='<div class="feedback"><strong>'+(ok?'✓ Correct!':'Not quite!')+'</strong><br>Answer: <strong>'+a.answer+'</strong><br>'+a.why+'</div><button class="next" id="next">'+(i===ads.length-1?'See My Results':'Next Advertisement →')+'</button>';document.getElementById('next').onclick=()=>{i++;selected=null;if(i<ads.length)render();else finish()};document.getElementById('status').textContent='Ad '+(i+1)+' of '+ads.length+' · Score: '+score}function finish(){document.getElementById('bar').style.width='100%';document.getElementById('status').textContent='Challenge completed';game.innerHTML='<div style="text-align:center;padding:35px 0"><div style="font-size:65px">🏆</div><h2>Advertising Detective!</h2><div class="score">Your score: '+score+' / '+ads.length+'</div><p>Great work! Remember: Think before you buy.</p><button class="next" id="again">Try Again ↻</button></div>';document.getElementById('again').onclick=()=>{i=0;score=0;selected=null;render()}}render();</script></body></html>
